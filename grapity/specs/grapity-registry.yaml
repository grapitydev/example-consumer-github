            format: date-time
            type: string
        - description: Maximum number of logs to return
          in: query
          name: limit
          schema:
            default: 50
            type: integer
        - description: Number of logs to skip
          in: query
          name: offset
          schema:
            default: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
