                plugins:
                  - config:
                      minute: 1000
                    name: rate-limiting
                    order: 1
                upstream: http://payments-staging:8080
          type: object
        name:
          examples:
            - payments-api-gateway
          type: string
        provider:
          enum:
            - kong
