openapi: 3.1.0
info:
  description: >
    The Grapity Registry is an API contract guardian. It validates, versions,
    and enforces backward compatibility for OpenAPI and AsyncAPI specs. It also
    manages gateway configurations and ingests gateway access logs. Every spec
    that enters the registry has earned its place.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Grapity Registry API
  version: 0.2.0
servers:
  - description: Production server
    url: https://registry.grapity.dev
  - description: Local development server
    url: http://localhost:3750
tags:
  - description: Server health
    name: health
  - description: >-
      Spec management — push, list, retrieve, validate, versions, delete, and
      compatibility
    name: specs
  - description: Gateway configuration management
    name: gateway-configs
  - description: Gateway access log ingestion and querying
    name: gateway-logs
paths:
  /v1/gateway-configs:
    get:
      tags:
        - gateway-configs
      summary: List all gateway configurations
      operationId: listGatewayConfigs
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      - createdAt: '2026-04-25T10:30:00.000Z'
                        id: cfg-uuid-1
                        name: payments-api-gateway
                        provider: kong
                        specName: payments-api
                        specSemver: 1.2.0
                        updatedAt: '2026-06-07T14:00:00.000Z'
              schema:
                $ref: '#/components/schemas/ListGatewayConfigsResponse'
          description: List of gateway configurations
        '401':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: unauthorized
                    message: Invalid or missing bearer token
                    statusCode: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: forbidden
                    message: 'Missing required scope: specs:write'
                    statusCode: 403
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden - missing required scope
        '500':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: internal_error
                    message: Internal server error
                    statusCode: 500
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal server error
      security:
        - keycloak:
            - gateway-configs:read
    post:
      tags:
        - gateway-configs
      summary: Push a gateway configuration version
      description: >
        Push a new gateway configuration version. On the first push for a given
        name, the config is created. On subsequent pushes, a new version is
        added and old versions are retained (up to 5).
      operationId: pushGatewayConfig
      requestBody:
        content:
          application/json:
            examples:
              default:
                summary: Default
                value:
                  callerIdentification:
                    rules:
                      - confidence: high
                        source: header:x-consumer-id
                    strategy: first-match
                  content: |-
                    apiVersion: v1
                    kind: GatewayConfig
                  environments:
                    staging:
                      kongAddr: http://kong-staging:8001
                      plugins:
                        - config:
                            minute: 1000
                          name: rate-limiting
                          order: 1
                        - config:
                            issuer: https://auth.example.com
                          name: jwt
                          order: 2
                      upstream: http://payments-staging:8080
                  name: payments-api-gateway
                  provider: kong
                  pushedBy: github-actions[bot]
                  routes:
                    - methods:
                        - GET
                        - POST
                      path: /payments
                    - methods:
                        - GET
                        - PUT
                        - DELETE
                      path: /payments/{id}
                  specName: payments-api
                  specSemver: 1.2.0
            schema:
              $ref: '#/components/schemas/PushGatewayConfigRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    data:
                      config:
                        createdAt: '2026-04-25T10:30:00.000Z'
                        id: cfg-uuid-1
                        name: payments-api-gateway
                        provider: kong
                        specName: payments-api
                        specSemver: 1.2.0
                        updatedAt: '2026-06-07T14:00:00.000Z'
                      version:
                        callerIdentification:
                          rules:
                            - confidence: high
                              source: header:x-consumer-id
                          strategy: first-match
                        checksum: sha256-abc123
                        content: |-
                          apiVersion: v1
                          kind: GatewayConfig
                        createdAt: '2026-06-07T14:00:00.000Z'
                        environments:
                          - kongAddr: http://kong-staging:8001
                            name: staging
                            plugins:
                              - config:
                                  minute: 1000
                                name: rate-limiting
                                order: 1
                            upstream: http://payments-staging:8080
                        gatewayConfigId: cfg-uuid-1
                        id: ver-uuid-1
                        pushedBy: github-actions[bot]
                        routes:
                          - methods:
                              - GET
                              - POST
                            path: /payments
              schema:
                $ref: '#/components/schemas/PushGatewayConfigResponse'
          description: Gateway configuration version registered successfully
        '400':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: bad_request
                    message: 'Missing required field: name'
                    statusCode: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing required fields
        '401':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: unauthorized
                    message: Invalid or missing bearer token
                    statusCode: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: forbidden
                    message: 'Missing required scope: specs:write'
                    statusCode: 403
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden - missing required scope
        '409':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: name_exists
                    message: >-
                      Gateway config name 'payments-api-gateway' already exists
                      with a different spec
                    statusCode: 409
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Gateway config name already exists with different spec
        '422':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: unsupported_provider
                    message: Unsupported provider 'nginx'
                    statusCode: 422
              schema:
                $ref: '#/components/schemas/ApiError'
          description: >-
            Validation error (unsupported provider, spec not found, route not
            found, or no environments)
        '500':
          content:
            application/json:
              examples:
                default:
                  summary: Default
                  value:
                    error: internal_error
                    message: Internal server error
                    statusCode: 500
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal server error
      security:
        - keycloak:
            - gateway-configs:write
