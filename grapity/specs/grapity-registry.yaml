            - string
            - 'null'
      type: object
    PushGatewayConfigRequest:
      properties:
        callerIdentification:
          $ref: '#/components/schemas/CallerIdentification'
        content:
          description: Raw gateway config document
          examples:
            - |-
              apiVersion: v1
              kind: GatewayConfig
          type: string
        environments:
          additionalProperties:
            properties:
              kongAddr:
                type: string
              name:
                type: string
              plugins:
                items:
                  $ref: '#/components/schemas/GatewayPlugin'
                type: array
              upstream:
                type: string
            required:
              - name
              - kongAddr
              - upstream
              - plugins
            type: object
          examples:
