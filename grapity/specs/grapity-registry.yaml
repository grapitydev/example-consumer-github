              $ref: '#/components/schemas/GatewayConfig'
            version:
              $ref: '#/components/schemas/GatewayConfigVersion'
          required:
            - config
            - version
          type: object
      required:
        - data
      type: object
    PushSpecRequest:
      properties:
        content:
          description: Raw OpenAPI or AsyncAPI document (YAML or JSON)
          examples:
            - |-
              openapi: 3.1.0
              info:
                title: Payments API
                version: 1.0.0
          type: string
        description:
          examples:
            - Payments service API
          type: string
        force:
          default: false
          description: Override breaking change block. Requires `reason`.
          type: boolean
        gitRef:
          description: Git commit SHA
          examples:
            - a1b2c3d4
          type: string
        name:
          examples:
            - payments-api
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        owner:
          examples:
            - platform-team
          type: string
        prerelease:
          default: false
          description: Push as a prerelease version (0.x)
          type: boolean
        pushedBy:
          description: User or CI identity performing the push
          examples:
            - github-actions[bot]
          type: string
        reason:
          description: Required when `force` is true. Recorded in the audit log.
          examples:
            - security fix CVE-2026-1234
          type: string
        sourceRepo:
          format: uri
          type: string
        tags:
          examples:
            - - payments
              - public
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/SpecType'
        visibility:
          description: >
            Spec visibility. Known values: "private", "public". Applied on
            create; on subsequent pushes, supplying it updates the spec's
            visibility, omitting it leaves visibility unchanged. Default:
            "private".
          examples:
            - public
          type: string
      required:
        - content
        - name
      type: object
    PushSpecResponse:
      properties:
        data:
          properties:
            compatReport:
              $ref: '#/components/schemas/CompatReport'
            isNewSpec:
              description: True if this is the first version of this spec
              type: boolean
            spec:
              $ref: '#/components/schemas/Spec'
            unchanged:
              description: >-
                True when the pushed content is identical to the latest version
                and no new version was created (200 response)
              type: boolean
            version:
              $ref: '#/components/schemas/SpecVersion'
          required:
            - isNewSpec
            - spec
            - version
            - compatReport
          type: object
      required:
        - data
      type: object
    SafeChange:
      properties:
        category:
          enum:
            - structural
            - documentation
          examples:
            - structural
          type: string
        description:
          examples:
            - Optional response property 'metadata' added to GET /users/{id}
          type: string
        id:
          examples:
            - chg-1
          type: string
        path:
          examples:
            - /users/{id}/GET/response/200/metadata
          type: string
        rule:
          description: >
            Machine-readable rule identifier. Treat as an open string — new
            rules will be added as the compat engine evolves. Known values:
            endpoint-added, endpoint-deprecated, optional-request-param-added,
            response-status-added, draft-endpoint-changed.
          examples:
            - endpoint-added
          type: string
      required:
        - id
        - rule
        - description
        - path
        - category
      title: SafeChange
      type: object
    Spec:
      properties:
        createdAt:
          examples:
            - '2026-04-25T10:30:00.000Z'
          format: date-time
          type: string
        description:
          examples:
            - Payments service API
          type: string
        id:
          examples:
            - a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        name:
          examples:
            - payments-api
          type: string
        owner:
          examples:
            - platform-team
          type: string
        sourceRepo:
          examples:
            - https://github.com/acme/payments-service
          format: uri
          type: string
        tags:
          examples:
            - - payments
              - public
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/SpecType'
        updatedAt:
          examples:
            - '2026-06-07T14:00:00.000Z'
          format: date-time
          type: string
        visibility:
          description: >
            Controls anonymous read access. Treat as an open string — new values
            may be added as access models evolve. Known values: "private"
            (authenticated reads only), "public" (anonymous reads allowed for
            this spec's metadata, versions, content, and compatibility reports).
            Defaults to "private" on first push.
          examples:
            - public
          type: string
      required:
        - id
        - name
        - type
        - tags
        - visibility
        - createdAt
        - updatedAt
      type: object
    SpecListItem:
      allOf:
        - $ref: '#/components/schemas/Spec'
      properties:
        latestVersion:
          $ref: '#/components/schemas/SpecVersion'
      type: object
    SpecType:
      enum:
        - openapi
        - asyncapi
      type: string
    SpecVersion:
      properties:
        checksum:
          description: SHA-256 hash of the content
          examples:
            - sha256-abc123...
          type: string
        compatibility:
          $ref: '#/components/schemas/CompatReport'
        createdAt:
          examples:
            - '2026-06-07T14:00:00.000Z'
          format: date-time
          type: string
        forceReason:
          description: Reason provided when force-pushing a breaking change
          examples:
            - security fix CVE-2026-1234
          type: string
        gitRef:
          description: Git commit SHA at time of push
          examples:
            - a1b2c3d4
          type: string
        id:
          examples:
            - ver-uuid-1
          format: uuid
          type: string
        isPrerelease:
          examples:
            - false
          type: boolean
        previousVersion:
          description: Semver of the previous version this was diffed against
          examples:
            - 1.1.0
          type: string
        pushedBy:
          description: User or CI identity that pushed this version
          examples:
            - github-actions[bot]
          type: string
        semver:
          examples:
            - 1.2.0
          type: string
        specId:
          examples:
            - a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
      required:
        - id
        - specId
        - semver
        - checksum
        - isPrerelease
        - createdAt
      type: object
    UpdateSpecRequest:
      properties:
        visibility:
          description: >
            New spec visibility. Known values: "private", "public". Changes take
            effect immediately and do not create a new version.
          examples:
            - public
          type: string
      required:
        - visibility
      type: object
    UpdateSpecResponse:
      properties:
        data:
          properties:
            spec:
              $ref: '#/components/schemas/Spec'
          required:
            - spec
          type: object
      required:
        - data
      type: object
    ValidateSpecRequest:
      properties:
        content:
          description: Raw OpenAPI or AsyncAPI document (YAML or JSON)
          examples:
            - |-
              openapi: 3.1.0
              info:
                title: Payments API
                version: 1.0.0
          type: string
      required:
        - content
      type: object
    ValidateSpecResponse:
      properties:
        data:
          properties:
            compatReport:
              $ref: '#/components/schemas/CompatReport'
            errors:
              items:
                type: string
              type: array
            unchanged:
              description: >-
                True when the content is identical to the latest version;
                pushing it would register nothing
              type: boolean
            valid:
              type: boolean
            warnings:
              items:
                type: string
              type: array
          required:
            - valid
          type: object
      required:
        - data
      type: object
    VersionClassification:
      enum:
        - initial
        - major
        - minor
        - patch
      type: string
    VersionsPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SpecVersion'
          type: array
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - data
        - pagination
      type: object
  parameters:
    environment:
      description: Deployment environment (e.g., staging, production)
      examples:
        default:
          summary: Default
          value: staging
      in: path
      name: environment
      required: true
      schema:
        type: string
    gatewayConfigName:
      description: URL-friendly gateway config identifier
      examples:
        default:
          summary: Default
          value: payments-api-gateway
      in: path
      name: name
      required: true
      schema:
        pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
        type: string
    logId:
      description: Gateway log entry UUID
      examples:
        default:
          summary: Default
          value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
    provider:
      description: Gateway provider (e.g., kong)
      examples:
        default:
          summary: Default
          value: kong
      in: path
      name: provider
      required: true
      schema:
        type: string
    semver:
      description: Semantic version
      examples:
        default:
          summary: Default
          value: 1.2.0
      in: path
      name: semver
      required: true
      schema:
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
        type: string
    specName:
      description: URL-friendly spec identifier
      examples:
        default:
          summary: Default
          value: payments-api
      in: path
      name: name
      required: true
      schema:
        pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
        type: string
    versionId:
      description: Gateway config version UUID
      examples:
        default:
          summary: Default
          value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      in: path
      name: versionId
      required: true
      schema:
        format: uuid
        type: string
  securitySchemes:
    keycloak:
      description: >-
        Keycloak OpenID Connect. The actual discovery URL is derived at runtime
        from the configured Keycloak serverUrl and realm:
        {serverUrl}/realms/{realm}/.well-known/openid-configuration.
      openIdConnectUrl: >-
        https://keycloak.example.com/realms/{realm}/.well-known/openid-configuration
      type: openIdConnect
security:
  - keycloak: []
