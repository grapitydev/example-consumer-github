      summary: Compare two versions of a spec
      description: >-
        Returns an incremental comparison between two versions. All versions
        between the two endpoints are included, ordered oldest to newest. The
        response contains the precomputed compatibility report for each step.
        Anonymous access: requests without a token are allowed when the spec's
        visibility is "public". For private specs, anonymous requests receive
        404 so spec names cannot be enumerated.
      operationId: compareVersions
      parameters:
        - $ref: '#/components/parameters/specName'
        - description: >-
            Starting version (inclusive). If newer than `to`, the order is
            normalized.
          examples:
            default:
              summary: Default
              value: 1.0.0
          in: query
          name: from
          required: true
          schema:
            pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
            type: string
        - description: >-
            Ending version (inclusive). If older than `from`, the order is
            normalized.
