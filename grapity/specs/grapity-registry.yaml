components:
  schemas:
    ApiError:
      properties:
        error:
          description: Machine-readable error code
          examples:
            - not_found
          type: string
        message:
          description: Human-readable error description
          examples:
            - Spec "payments-api" not found
          type: string
        statusCode:
          examples:
            - 404
          type: integer
      required:
        - error
        - message
        - statusCode
      type: object
    BreakingChange:
      properties:
        affectedConsumers:
          examples:
            - - mobile-app
              - web-portal
          items:
            type: string
          type: array
        category:
          enum:
            - structural
            - documentation
          examples:
            - structural
          type: string
        description:
          examples:
            - Response property 'userId' was removed from GET /users/{id}
          type: string
        id:
          examples:
            - chg-2
          type: string
        newValue:
          examples:
            - 'null'
          type: string
        originalValue:
          examples:
            - string
          type: string
        path:
          examples:
            - /users/{id}/GET/response/200/userId
          type: string
        rule:
          description: >
            Machine-readable rule identifier. Treat as an open string — new
            rules will be added as the compat engine evolves. Known values:
            endpoint-removed, endpoint-removed-without-deprecation,
            endpoint-removed-missing-sunset, endpoint-removed-before-sunset,
            required-request-param-added, response-property-removed,
            response-status-removed, stable-endpoint-marked-draft.
          examples:
            - response-property-removed
          type: string
      required:
        - id
        - rule
        - description
        - path
        - category
      title: BreakingChange
      type: object
    BreakingChangeError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - description: >
            Returned when a push is blocked due to breaking changes. The
            compatReport describes exactly what changed and suggests the correct
            next semver.
          properties:
            compatReport:
              $ref: '#/components/schemas/CompatReport'
          required:
            - compatReport
          type: object
    CallerIdentification:
      properties:
        rules:
          items:
            $ref: '#/components/schemas/CallerIdentificationRule'
          type: array
        strategy:
          enum:
            - first-match
          examples:
            - first-match
          type: string
      required:
        - strategy
        - rules
      type: object
    CallerIdentificationRule:
      properties:
        confidence:
          enum:
            - high
            - medium
            - low
            - anonymous
          examples:
            - high
          type: string
        source:
          examples:
            - header:x-consumer-id
          type: string
      required:
        - source
        - confidence
      type: object
    CompareStep:
      properties:
        breakingChanges:
          items:
            $ref: '#/components/schemas/BreakingChange'
          type: array
        classification:
          $ref: '#/components/schemas/VersionClassification'
        previousVersion:
          examples:
            - 1.0.0
          type: string
        safeChanges:
          items:
            $ref: '#/components/schemas/SafeChange'
          type: array
        version:
          examples:
            - 1.1.0
          type: string
      required:
        - version
        - previousVersion
        - classification
        - breakingChanges
        - safeChanges
      type: object
    CompareVersionsResponse:
      properties:
        data:
          properties:
            from:
              examples:
                - 1.0.0
              type: string
            steps:
              items:
                $ref: '#/components/schemas/CompareStep'
              type: array
            to:
              examples:
                - 1.3.0
              type: string
          required:
            - from
